    <linearGradient id="vn-line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="600">
      <stop offset="0" stop-color="#D9BD77" stop-opacity="1"/>
      <stop offset="1" stop-color="#C8A44D" stop-opacity="0.78"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#vn-sky)"/>
