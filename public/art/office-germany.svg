      <rect x="376" y="290" width="24" height="150"/>
      <line x1="384" y1="300" x2="384" y2="432" stroke-opacity="0.55"/>
      <line x1="392" y1="300" x2="392" y2="432" stroke-opacity="0.55"/>
      <rect x="430" y="290" width="24" height="150"/>
      <line x1="438" y1="300" x2="438" y2="432" stroke-opacity="0.55"/>
      <line x1="446" y1="300" x2="446" y2="432" stroke-opacity="0.55"/>
