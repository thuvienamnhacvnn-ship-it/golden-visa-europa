<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <defs>
    <linearGradient id="de-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F4A72"/>
      <stop offset="1" stop-color="#071B30"/>
    </linearGradient>
    <radialGradient id="de-sun" cx="0.72" cy="0.26" r="0.34">
      <stop offset="0" stop-color="#C8A44D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C8A44D" stop-opacity="0"/>
    </radialGradient>
    <!-- userSpaceOnUse là bắt buộc: với objectBoundingBox, một nét thẳng đứng
         hay nằm ngang có bbox rộng/cao bằng 0 nên SVG bỏ không vẽ. -->
    <linearGradient id="de-line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="600">
      <stop offset="0" stop-color="#D9BD77" stop-opacity="1"/>
      <stop offset="1" stop-color="#C8A44D" stop-opacity="0.78"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#de-sky)"/>
  <rect width="800" height="600" fill="url(#de-sun)"/>
  <g stroke="#C8A44D" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="600"/><line x1="48" y1="0" x2="48" y2="600"/><line x1="96" y1="0" x2="96" y2="600"/><line x1="144" y1="0" x2="144" y2="600"/><line x1="192" y1="0" x2="192" y2="600"/><line x1="240" y1="0" x2="240" y2="600"/><line x1="288" y1="0" x2="288" y2="600"/><line x1="336" y1="0" x2="336" y2="600"/><line x1="384" y1="0" x2="384" y2="600"/><line x1="432" y1="0" x2="432" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/><line x1="528" y1="0" x2="528" y2="600"/><line x1="576" y1="0" x2="576" y2="600"/><line x1="624" y1="0" x2="624" y2="600"/><line x1="672" y1="0" x2="672" y2="600"/><line x1="720" y1="0" x2="720" y2="600"/><line x1="768" y1="0" x2="768" y2="600"/>
  </g>
  <g fill="none" stroke="url(#de-line)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="square">
    <rect x="248" y="252" width="330" height="38"/>
    <path d="M248 252 h330" stroke-opacity="0.7"/>
